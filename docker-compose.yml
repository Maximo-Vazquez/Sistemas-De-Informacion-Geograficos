# Servicios de desarrollo. Base de datos: Para la etapa GIS, cambiar la imagen por
# postgis/postgis:17-3.5 y definir DB_ENGINE=django.contrib.gis.db.backends.postgis.
services:
  db:
    image: postgres:17
    environment:
      POSTGRES_DB: visor_sig
      POSTGRES_USER: visor_sig
      POSTGRES_PASSWORD: visor_sig
    ports:
      - "5432:5432"
    volumes:
      - datos_db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U visor_sig -d visor_sig"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Servidor de mapas WMS/WFS (ADR-0008). Consola: http://localhost:8085/geoserver
  geoserver:
    image: docker.osgeo.org/geoserver:2.27.2
    environment:
      GEOSERVER_ADMIN_USER: admin
      GEOSERVER_ADMIN_PASSWORD: ${GEOSERVER_ADMIN_PASSWORD:-geoserver}
      # El visor pide WMS/WFS desde el navegador (localhost:8000 -> localhost:8085).
      CORS_ENABLED: "true"
      CORS_ALLOWED_ORIGINS: "*"
      SKIP_DEMO_DATA: "true"
    ports:
      - "${GEOSERVER_PORT:-8085}:8080"
    volumes:
      - datos_geoserver:/opt/geoserver_data
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://localhost:8080/geoserver/web/ > /dev/null"]
      interval: 15s
      timeout: 5s
      retries: 20
      start_period: 60s

volumes:
  datos_db:
  datos_geoserver:

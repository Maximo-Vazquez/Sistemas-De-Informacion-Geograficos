# Servicios de desarrollo (ejecución local, ADR-0012). `db`: base de la aplicación Django.
# `postgis`: capas del SIG IGN 250 (ADR-0015), que GeoServer publica por WMS/WFS.
# Carga: python scripts/cargar_capas_ign.py
services:
  # Opcional: Django en un contenedor (docker compose --profile web up -d). Sirve los
  # estáticos compilados; para desarrollar se usa python manage.py runserver.
  web:
    profiles: ["web"]
    image: visor-sig-chaco:latest
    build: .
    env_file: .env
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.local
      DEBUG: "True"
      DB_HOST: db
      # El navegador sigue usando localhost:8085; Django reenvía el WFS-T por la red de Compose.
      GEOSERVER_URL_INTERNA: http://geoserver:8080/geoserver
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      db:
        condition: service_healthy
      geoserver:
        condition: service_healthy

  db:
    image: postgres:17
    environment:
      POSTGRES_DB: visor_sig
      POSTGRES_USER: visor_sig
      POSTGRES_PASSWORD: visor_sig
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - datos_db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U visor_sig -d visor_sig"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Base espacial con las capas del IGN (ADR-0015). Desde el host: localhost:5433.
  postgis:
    image: postgis/postgis:17-3.5
    # Esta etiqueta oficial se distribuye para amd64; Docker Desktop ARM la emula.
    platform: linux/amd64
    environment:
      POSTGRES_DB: sig_ign
      POSTGRES_USER: sig_ign
      POSTGRES_PASSWORD: ${POSTGIS_PASSWORD:-sig_ign}
    ports:
      - "127.0.0.1:${POSTGIS_PORT:-5433}:5432"
    volumes:
      - datos_postgis:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sig_ign -d sig_ign"]
      interval: 5s
      timeout: 3s
      retries: 20

  # Servidor de mapas WMS/WFS (ADR-0008). Consola: http://localhost:8085/geoserver
  geoserver:
    image: docker.osgeo.org/geoserver:2.27.2
    environment:
      GEOSERVER_ADMIN_USER: admin
      GEOSERVER_ADMIN_PASSWORD: ${GEOSERVER_ADMIN_PASSWORD:-geoserver}
      # El visor pide WMS/WFS desde el navegador (localhost:8000 -> localhost:8085).
      CORS_ENABLED: "true"
      CORS_ALLOWED_ORIGINS: "*"
      SKIP_DEMO_DATA: "true"
    ports:
      - "127.0.0.1:${GEOSERVER_PORT:-8085}:8080"
    volumes:
      - datos_geoserver:/opt/geoserver_data
    depends_on:
      postgis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://localhost:8080/geoserver/web/ > /dev/null"]
      interval: 15s
      timeout: 5s
      retries: 20
      start_period: 60s

volumes:
  datos_db:
  datos_geoserver:
  datos_postgis:

name: 0. Calidad (tests, lint y build)

on:
  push:
    branches: [develop, main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        # Etapa GIS: cambiar por postgis/postgis:17-3.5
        image: postgres:17
        env:
          POSTGRES_DB: visor_sig
          POSTGRES_USER: visor_sig
          POSTGRES_PASSWORD: visor_sig
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U visor_sig" --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      DB_HOST: localhost
      DJANGO_SETTINGS_MODULE: config.settings.test
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Instalar dependencias
        run: pip install -r requirements.txt
      - name: Ruff (estilo y complejidad ciclomática)
        run: ruff check .
      - name: Largo de archivos (aviso, no bloquea)
        run: python scripts/check_file_length.py
      - name: Chequeos de Django
        run: |
          python manage.py check
          python manage.py makemigrations --check --dry-run
      - name: Tests
        run: python manage.py test

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: frontend/package.json
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm check:colores
      - run: pnpm build

  bitacora:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Dependencias de WeasyPrint
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libpango-1.0-0 libpangoft2-1.0-0 fonts-liberation
      - run: pip install -r requirements.txt
      - name: Verificar que la bitácora generada esté al día
        run: python scripts/generar_bitacora.py --verificar
      - name: Generar PDF
        run: python scripts/generar_bitacora.py
      - uses: actions/upload-artifact@v4
        with:
          name: bitacora-pdf
          path: docs/bitacora/salida/bitacora.pdf

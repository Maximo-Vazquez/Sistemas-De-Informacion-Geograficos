name: 2. Deploy Manual a VPS
run-name: "Deploy VPS - imagen: ${{ inputs.image_tag && inputs.image_tag != 'auto' && format('ghcr.io/maximo-vazquez/sistemas-de-informacion-geograficos:{0}', inputs.image_tag) || 'auto (se resuelve a ultima v*)' }}"

on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: "Tag a desplegar. Usa auto para tomar la ultima version real publicada (v*)."
        required: true
        default: "auto"
        type: string

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    env:
      IMAGE_REPO: ghcr.io/maximo-vazquez/sistemas-de-informacion-geograficos
      IMAGE_TAG_REQUESTED: ${{ inputs.image_tag || 'auto' }}

    steps:
      - name: Checkout del codigo
        uses: actions/checkout@v4

      - name: Resolver tag real de imagen
        id: resolve_image
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          requested="${IMAGE_TAG_REQUESTED}"
          if [[ "$requested" != "auto" && "$requested" != "latest" ]]; then
            echo "image_tag=$requested" >> "$GITHUB_OUTPUT"
            echo "Usando tag solicitado manualmente: $requested"
            exit 0
          fi

          owner="${{ github.repository_owner }}"
          package="${IMAGE_REPO##*/}"
          tags=""

          for scope in users orgs; do
            api="https://api.github.com/${scope}/${owner}/packages/container/${package}/versions?per_page=100"
            if response=$(curl -fsSL \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H "Accept: application/vnd.github+json" \
              "$api" 2>/dev/null); then
              tags=$(printf "%s" "$response" \
                | jq -r '.[].metadata.container.tags[]?' \
                | grep -E '^v[0-9]+(\.[0-9]+)*$' \
                | sort -uV || true)
              if [[ -n "${tags}" ]]; then
                break
              fi
            fi
          done

          if [[ -z "${tags}" ]]; then
            echo "No se encontro ningun tag versionado v* en GHCR para ${IMAGE_REPO}" >&2
            exit 1
          fi

          latest_tag=$(printf "%s\n" "$tags" | tail -n 1)
          echo "image_tag=$latest_tag" >> "$GITHUB_OUTPUT"
          echo "Tag real detectado automaticamente: $latest_tag"

      - name: Mostrar version efectiva
        shell: bash
        run: |
          IMAGE_FULL="${IMAGE_REPO}:${{ steps.resolve_image.outputs.image_tag }}"
          echo "Imagen efectiva: ${IMAGE_FULL}"
          {
            echo "## Deploy VPS"
            echo "- Tag solicitado: ${IMAGE_TAG_REQUESTED}"
            echo "- Tag efectivo: ${{ steps.resolve_image.outputs.image_tag }}"
            echo "- Imagen efectiva: ${IMAGE_FULL}"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Copiar manifiestos al VPS
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT }}
          source: "k8s/*.yaml"
          target: "/home/${{ secrets.VPS_USER }}/deployments/sig"
          strip_components: 1
          timeout: 300s
          command_timeout: 10m

      - name: Ejecutar despliegue en VPS
        uses: appleboy/ssh-action@v1.0.0
        env:
          DJANGO_SECRET_KEY: ${{ secrets.DJANGO_SECRET_KEY }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT }}
          envs: DJANGO_SECRET_KEY,GOOGLE_CLIENT_ID,GOOGLE_CLIENT_SECRET
          script: |
            set -euo pipefail
            IMAGE_FULL="${{ env.IMAGE_REPO }}:${{ steps.resolve_image.outputs.image_tag }}"
            KUBECONFIG_PATH="${HOME}/.kube/config"

            echo "Iniciando despliegue en VPS..."
            echo "Imagen objetivo: ${IMAGE_FULL}"

            run_kubectl() {
              if command -v kubectl >/dev/null 2>&1; then
                kubectl --kubeconfig "${KUBECONFIG_PATH}" "$@"
              elif command -v k3s >/dev/null 2>&1; then
                k3s kubectl --kubeconfig "${KUBECONFIG_PATH}" "$@"
              else
                echo "No se encontro kubectl ni k3s en el VPS." >&2
                exit 1
              fi
            }

            prune_old_app_images() {
              local image_repo="$1"
              local keep_tag="$2"
              # Conserva la version desplegada y hasta cinco versiones previas.
              local keep_count="${3:-6}"
              local images_output=""

              local cri_candidates=()
              if command -v k3s >/dev/null 2>&1; then
                if command -v sudo >/dev/null 2>&1; then
                  cri_candidates+=("sudo -n k3s crictl")
                fi
                cri_candidates+=("k3s crictl")
              fi
              if command -v crictl >/dev/null 2>&1; then
                if command -v sudo >/dev/null 2>&1; then
                  cri_candidates+=("sudo -n crictl")
                fi
                cri_candidates+=("crictl")
              fi

              if [[ "${#cri_candidates[@]}" -eq 0 ]]; then
                echo "crictl no disponible; se omite limpieza de imagenes."
                return 0
              fi

              echo "Limpiando imagenes viejas de ${image_repo}; conservando ${keep_tag} y ${keep_count} tags recientes."
              local selected_cri=""
              for cri_candidate in "${cri_candidates[@]}"; do
                if images_output=$(${cri_candidate} images 2>/dev/null); then
                  selected_cri="${cri_candidate}"
                  break
                fi
              done

              if [[ -z "${selected_cri}" ]]; then
                echo "No se pudo listar imagenes con crictl por permisos/configuracion; se omite limpieza."
                return 0
              fi

              mapfile -t keep_tags < <(
                printf "%s\n" "${images_output}" |
                  awk -v repo="${image_repo}" '$1 == repo && $2 ~ /^v[0-9]+(\.[0-9]+)*$/ {print $2}' |
                  sort -uV |
                  tail -n "${keep_count}"
              )
              keep_tags+=("${keep_tag}")

              printf "%s\n" "${images_output}" |
                awk -v repo="${image_repo}" '$1 == repo && $2 != "<none>" {print $2}' |
                sort -u |
                while read -r tag; do
                  [[ -n "${tag}" ]] || continue
                  local keep="false"
                  for keep_item in "${keep_tags[@]}"; do
                    if [[ "${tag}" == "${keep_item}" ]]; then
                      keep="true"
                      break
                    fi
                  done
                  if [[ "${keep}" == "true" ]]; then
                    echo "Conservando ${image_repo}:${tag}"
                  else
                    echo "Eliminando ${image_repo}:${tag}"
                    if command -v timeout >/dev/null 2>&1; then
                      timeout 60 ${selected_cri} rmi "${image_repo}:${tag}" || true
                    else
                      ${selected_cri} rmi "${image_repo}:${tag}" || true
                    fi
                  fi
                done
            }

            if [[ ! -r "${KUBECONFIG_PATH}" ]]; then
              echo "No se puede leer kubeconfig en: ${KUBECONFIG_PATH}" >&2
              echo "Solucion en el VPS (como root):" >&2
              echo "  mkdir -p /home/${{ secrets.VPS_USER }}/.kube" >&2
              echo "  cp /etc/rancher/k3s/k3s.yaml /home/${{ secrets.VPS_USER }}/.kube/config" >&2
              echo "  chown -R ${{ secrets.VPS_USER }}:${{ secrets.VPS_USER }} /home/${{ secrets.VPS_USER }}/.kube" >&2
              echo "  chmod 600 /home/${{ secrets.VPS_USER }}/.kube/config" >&2
              exit 1
            fi

            echo "Chequeo rapido de acceso al cluster..."
            run_kubectl version --client
            run_kubectl get nodes

            if [[ -z "${DJANGO_SECRET_KEY:-}" || -z "${GOOGLE_CLIENT_ID:-}" || -z "${GOOGLE_CLIENT_SECRET:-}" ]]; then
              echo "Faltan secrets obligatorios: DJANGO_SECRET_KEY, GOOGLE_CLIENT_ID o GOOGLE_CLIENT_SECRET." >&2
              exit 1
            fi

            DEPLOY_DIR="${HOME}/deployments/sig"
            mkdir -p "$DEPLOY_DIR"
            cd "$DEPLOY_DIR"

            echo "Actualizando credenciales de Django..."
            run_kubectl create secret generic sig-runtime-credentials \
              --from-literal=DJANGO_SECRET_KEY="${DJANGO_SECRET_KEY}" \
              --from-literal=GOOGLE_CLIENT_ID="${GOOGLE_CLIENT_ID}" \
              --from-literal=GOOGLE_CLIENT_SECRET="${GOOGLE_CLIENT_SECRET}" \
              --dry-run=client -o yaml | run_kubectl apply -f -

            echo "Aplicando manifiestos base..."
            run_kubectl apply -f "$DEPLOY_DIR/01-configmap-nginx.yaml"
            run_kubectl apply -f "$DEPLOY_DIR/02-deployment.yaml"
            run_kubectl apply -f "$DEPLOY_DIR/03-service.yaml"

            echo "Actualizando imagen del deployment a ${IMAGE_FULL}..."
            run_kubectl set image deployment/sig-deployment django-app="${IMAGE_FULL}"
            if ! run_kubectl set image deployment/sig-deployment django-migrate="${IMAGE_FULL}"; then
              echo "No se pudo actualizar django-migrate con set image; se aplica patch al primer initContainer."
              run_kubectl patch deployment/sig-deployment --type='json' \
                -p="[{\"op\":\"replace\",\"path\":\"/spec/template/spec/initContainers/0/image\",\"value\":\"${IMAGE_FULL}\"}]"
            fi

            echo "Configurando APP_VERSION=${{ steps.resolve_image.outputs.image_tag }} en el deployment..."
            run_kubectl set env deployment/sig-deployment APP_VERSION="${{ steps.resolve_image.outputs.image_tag }}"

            echo "Reiniciando deployment sig..."
            run_kubectl rollout restart deployment/sig-deployment
            run_kubectl rollout status deployment/sig-deployment --timeout=300s

            prune_old_app_images "${{ env.IMAGE_REPO }}" "${{ steps.resolve_image.outputs.image_tag }}" 6

            echo "Despliegue finalizado con exito. Imagen desplegada: ${IMAGE_FULL}"

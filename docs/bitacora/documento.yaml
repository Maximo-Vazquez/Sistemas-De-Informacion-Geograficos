# SemVer: major al cerrar una entrega, minor por contenido nuevo, patch por correcciones.
version: 0.12.0
versiones:
  - version: 0.1.0
    fecha: 2026-10-22
    cambios:
      - Creación del documento
      - Registro de la configuración de QGIS MCP y del mapa del Chaco
      - Base Django del proyecto y ADR-0001 a ADR-0006
  - version: 0.2.0
    fecha: 2026-10-22
    cambios:
      - Acceso a Administración para cualquier cuenta de Google
      - Base local gis_tpi y runserver que compila el frontend
      - Dependencias unificadas en requirements.txt y logo de la UTN
      - Globo 3D en la pantalla de inicio
      - Logo del equipo y botón estándar de Google
  - version: 0.3.0
    fecha: 2026-10-22
    cambios:
      - Pruebas de navegador con Playwright y capturas reproducibles
      - ADR-0007
  - version: 0.4.0
    fecha: 2026-10-29
    cambios:
      - GeoServer en Docker como servidor de mapas (ADR-0008)
      - OpenLayers y primera versión del visor (ADR-0009)
  - version: 0.5.0
    fecha: 2026-11-12
    cambios:
      - Revisión de cumplimiento del apartado a con evidencia de código y servicios locales
      - Guía de configuración OAuth de Google y aclaración del entorno Docker
      - Creación del espacio local ign y comprobación de servicios WMS y WFS sin capas
  - version: 0.6.0
    fecha: 2026-11-12
    cambios:
      - Configuración de credenciales OAuth reales en el entorno local y el contenedor Django
      - Verificación del inicio OAuth por POST con CSRF y redirección a Google
  - version: 0.6.1
    fecha: 2026-11-12
    cambios:
      - Corrección del arranque local para servir los archivos estáticos desde Compose
      - Confirmación del usuario del acceso autenticado al visor y visualización del mapa base
  - version: 0.7.0
    fecha: 2026-11-13
    cambios:
      - Carga de las 47 capas IGN y sus 570.443 elementos en PostGIS (ADR-0010)
      - Publicación en GeoServer y verificación individual de WMS, WFS y leyendas
      - Scripts y documentación para reproducir la importación y la publicación local
  - version: 0.8.0
    fecha: 2026-11-13
    cambios:
      - Inventario de las 47 capas, sus geometrías, tablas y cantidades
      - Resumen de los cambios realizados y guía para reproducir la carga en equipo
  - version: 0.9.0
    fecha: 2026-11-13
    cambios:
      - Propuesta de aplicación, GeoServer y PostGIS compartidos (ADR-0011)
      - Aclaración de la carga inicial de capas y del acceso sin ZIP para usuarios del visor
  - version: 0.10.0
    fecha: 2026-11-17
    cambios:
      - Integración de la rama del visor con búsqueda y grupos de capas
      - Incorporación de medición de distancias y consultas por punto y rectángulo
      - Actualización de verificaciones y pendientes de las funciones del visor
  - version: 0.11.0
    fecha: 2026-11-19
    cambios:
      - Alta de geometrías y atributos en la capa vectorial Relevamientos
      - Retiro de la configuración de despliegue remoto y actualización del arranque local
  - version: 0.12.0
    fecha: 2026-11-19
    cambios:
      - Simbología por clases de las 47 capas IGN generada por script (ADR-0014)
      - Leyenda del visor transparente y con el color de texto del tema
      - Consigna a.3 completa

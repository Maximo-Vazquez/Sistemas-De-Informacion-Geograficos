<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>$titulo</title>
<style>$css</style>
</head>
<body>
<div class="encabezado">
  <table>
    <tr>
      <td class="enc-logo">$logo_encabezado</td>
      <td class="enc-texto"><p>$encabezado_1</p><p>$encabezado_2</p></td>
    </tr>
  </table>
</div>
<div class="pie">
  <table><tr><td><p>Versión $version</p><p>$area</p></td><td class="pie-pagina"></td></tr></table>
</div>

<section class="portada">
  <div class="portada-logo">$logo_portada</div>
  <div class="portada-organizacion">$organizacion</div>
  <h1 class="portada-titulo">$titulo_portada</h1>
  <p class="portada-subtitulo">$subtitulo</p>
  <p class="portada-descripcion">$descripcion</p>
  <div class="portada-pie">$pie_portada</div>
</section>

<section class="preliminar">
$preliminar
</section>

<section class="indice">
  <h2 class="indice-titulo">Contenido</h2>
  $indice
</section>

<main class="cuerpo">
$cuerpo
</main>
</body>
</html>

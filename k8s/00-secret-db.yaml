apiVersion: v1
kind: Secret
metadata:
  name: db-credentials-sig
  namespace: default
type: Opaque
stringData:
  # Plantilla de referencia: completar en el VPS, no guardar valores reales en el repositorio.
  # En la etapa GIS esta base debe tener la extensión PostGIS (CREATE EXTENSION postgis;).
  host: "<DB_HOST>"
  port: "<DB_PORT>"
  user: "<DB_USER>"
  password: "<DB_PASSWORD>"

# Django + nginx en el mismo pod. Etapa GIS: PostGIS y GeoServer irán en
# manifiestos propios (04-postgis.yaml, 05-geoserver.yaml) con su Service.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: sig-deployment
  namespace: default
  labels:
    app: sig
spec:
  replicas: 1
  selector:
    matchLabels:
      app: sig
  template:
    metadata:
      labels:
        app: sig
    spec:
      volumes:
        - name: shared-static-vol
          emptyDir: {}
        - name: nginx-conf-vol
          configMap:
            name: sig-nginx-conf
      imagePullSecrets:
        - name: ghcr-cred
      initContainers:
        - name: django-migrate
          image: ghcr.io/maximo-vazquez/sistemas-de-informacion-geograficos:latest
          imagePullPolicy: Always
          command: ["python", "manage.py", "migrate", "--noinput"]
          envFrom:
            - secretRef:
                name: sig-runtime-credentials
          env: &django-env
            - name: DJANGO_SETTINGS_MODULE
              value: config.settings.production
            - name: ALLOWED_HOSTS
              value: "*"
            - name: CSRF_TRUSTED_ORIGINS
              value: "https://<DOMINIO>"
            - name: DB_NAME
              value: visor_sig
            - name: DB_HOST
              valueFrom:
                secretKeyRef:
                  name: db-credentials-sig
                  key: host
            - name: DB_PORT
              valueFrom:
                secretKeyRef:
                  name: db-credentials-sig
                  key: port
            - name: DB_USER
              valueFrom:
                secretKeyRef:
                  name: db-credentials-sig
                  key: user
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: db-credentials-sig
                  key: password
      containers:
        - name: django-app
          image: ghcr.io/maximo-vazquez/sistemas-de-informacion-geograficos:latest
          imagePullPolicy: Always
          command: ["/bin/sh", "-c"]
          args:
            - |
              cp -r /app/staticfiles/. /var/www/static/ && \
              gunicorn config.wsgi:application --bind 0.0.0.0:8000 --workers 3 --timeout 120
          ports:
            - containerPort: 8000
          # DJANGO_SECRET_KEY, GOOGLE_CLIENT_ID y GOOGLE_CLIENT_SECRET
          # llegan por el secret que crea el workflow de deploy.
          envFrom:
            - secretRef:
                name: sig-runtime-credentials
          env: *django-env
          volumeMounts:
            - name: shared-static-vol
              mountPath: /var/www/static
          readinessProbe:
            tcpSocket:
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 10
        - name: nginx-sidecar
          image: nginx:alpine
          ports:
            - containerPort: 80
          volumeMounts:
            - name: shared-static-vol
              mountPath: /var/www/static
              readOnly: true
            - name: nginx-conf-vol
              mountPath: /etc/nginx/conf.d/default.conf
              subPath: default.conf
